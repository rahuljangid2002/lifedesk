<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1324">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LifeDesk">
    <meta name="description" content="LifeDesk: money, budget, people and loans, with more everyday tools to come.">
    <title>LifeDesk</title>
    <script>
        // Light / dark chosen in Account: applied before the page is drawn, so there is no flash of the other theme.
        try {
            var t = localStorage.getItem('lifedesk-theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app"><div class="loading"><p>Loading…</p></div></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
